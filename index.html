.hero h1,.brand{font-family:'Baloo 2','Segoe UI',sans-serif}

:root{
  --ink:#2b2f6b;--text:#323759;--muted:#555b7c;--line:#e0e2ef;--page:#f8f8fc;
  --white:#fff;--lav:#f0eaff;--lav-deep:#dfd3ff;--sky:#ddf4ff;--mint:#dcf7e9;
  --yellow:#ffd50b;--butter:#fff5c9;--peach:#ffebe2;--green:#18634c;--red:#972f43;
  --r:22px;--shadow:0 9px 25px #2b2f6b0a;
  font:16px/1.55 "Segoe UI",system-ui,sans-serif;color:var(--text);background:var(--page);
}
*,*::before,*::after{box-sizing:border-box}
body,h1,h2,h3,p{margin:0}
h1,h2,h3,strong,b{color:var(--ink)}
h1,h2,h3{line-height:1.14;letter-spacing:-.035em}
h1{font-size:clamp(2rem,4.1vw,3.25rem);font-weight:800}
h2{font-size:clamp(1.35rem,2.5vw,1.8rem);font-weight:800}
h3{font-size:1.13rem}
a{color:var(--ink);text-decoration:none}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default;opacity:.55}
input:not([type=radio],[type=checkbox]),textarea,select{width:100%;min-width:0;border:1px solid #bdbfda;border-radius:12px;background:white;padding:10px 12px}
input[type=checkbox],input[type=radio]{accent-color:var(--ink)}
textarea{resize:vertical}
select{appearance:none;padding-right:30px;background:linear-gradient(45deg,transparent 50%,var(--ink) 51%) calc(100% - 16px) 50%/5px 5px no-repeat,linear-gradient(135deg,var(--ink) 50%,transparent 51%) calc(100% - 11px) 50%/5px 5px no-repeat,#fff}
input[type=file]{font-size:.875rem}
label{display:grid;gap:6px;font-size:.9rem;font-weight:650}
label.inline{display:flex;align-items:center;gap:8px}
:focus-visible{outline:3px solid #5846b4;outline-offset:3px}
main:focus{outline:none}
[hidden]{display:none!important}
.skip{position:fixed;top:8px;left:8px;z-index:12;transform:translateY(-150%);background:white;padding:12px}
.skip:focus{transform:none}
.wrap{max-width:1320px;margin:auto;padding-inline:32px}
.top{background:white;border-bottom:1px solid var(--line)}
.top-inner{min-height:76px;display:flex;align-items:center;justify-content:space-between;gap:22px}
.brand{display:inline-flex;align-items:center;gap:10px;font-size:1.4rem;font-weight:850;letter-spacing:-.06em;white-space:nowrap}
.brand-mark{display:grid;place-items:center;width:36px;height:36px;border-radius:12px;transform:rotate(-8deg);background:var(--yellow);border:2px solid var(--ink);box-shadow:2px 2px 0 var(--ink);font-weight:900}
.nav,.actions,.chips{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.nav{gap:6px}
.nav a{padding:8px 12px;border-radius:11px;font-weight:700;font-size:.9rem}
.nav a:hover,.nav a[aria-current]{background:var(--lav)}
.button{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:42px;padding:8px 16px;border:1px solid #c9cbe0;border-radius:999px;background:white;color:var(--ink);font-size:.9rem;font-weight:750;text-align:center}
.button:hover{background:var(--lav)}
.button.primary{background:var(--yellow);border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink)}
.button.primary:hover{background:#ffe052}
.button.dark{color:white;background:var(--ink);border-color:var(--ink)}
.button.danger{color:var(--red);border-color:#e4a3ae}
.button.small{min-height:34px;padding:4px 12px}
.pill{display:inline-flex;align-items:center;word-break:normal;gap:5px;padding:3px 9px;font-size:.8125rem;border-radius:99px;background:var(--lav);color:var(--ink);font-weight:750}
.pill.mint,.note.mint{background:var(--mint);color:var(--green)}
.pill.warn,.note.warn{background:var(--butter);color:#6b4600}
.pill.red,.note.red{background:#fde9ed;color:var(--red)}
.pill.gray{background:#eeeff5;color:var(--muted)}
.muted{color:var(--muted)}
.subtle,small{font-size:.875rem;color:var(--muted)}
.eyebrow{font-size:.78rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:#514485}
.hero{display:grid;grid-template-columns:1.12fr .88fr;align-items:center;gap:30px;background:var(--lav);border:1px solid var(--lav-deep);border-radius:34px;padding:clamp(24px,5vw,70px);min-height:390px;overflow:hidden}
.hero h1{font-size:clamp(2.75rem,6.3vw,5.4rem);line-height:.99;letter-spacing:-.047em;margin:12px 0 18px}
.highlight{background:linear-gradient(transparent 63%,#ffe77b 63% 76%,transparent 76%);box-decoration-break:clone}
.hero p{max-width:54ch;margin-bottom:24px}
.visual{min-height:300px;position:relative;isolation:isolate;display:grid;align-items:center}
.visual-art{display:block;width:100%;height:100%;object-fit:cover;border-radius:26px;position:absolute;inset:0;z-index:-1}
.visual.has-art{min-height:330px}
.visual-board{background:white;border:1.5px solid var(--ink);box-shadow:6px 7px 0 #bbaae8;border-radius:20px;padding:18px;margin:auto;width:min(290px,88%);transform:rotate(4deg)}
.visual.has-art .visual-board{align-self:end;margin:0 0 0 auto;width:min(240px,72%);padding:13px;transform:rotate(3deg)}
.fake-progress,progress{width:100%;height:9px;border-radius:999px;background:#e8e3f6;overflow:hidden;border:0;display:block;accent-color:#6652ac}
.fake-progress>span{display:block;height:100%;background:#8062d1;border-radius:999px}
.section{margin-top:30px}
.section-title{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.tiles,.grid2,.grid3,.grid4{display:grid;gap:16px;align-items:start}
.tiles,.grid3{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid4{grid-template-columns:repeat(4,minmax(0,1fr))}
.tiles{align-items:stretch}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:11px;min-height:200px;padding:22px;border:1px solid var(--line);border-radius:var(--r);background:white;box-shadow:var(--shadow)}
.tile:hover{border-color:#8878bf;box-shadow:0 8px 24px #2b2f6b16}
.tile .end{margin-top:auto;font-size:.875rem;font-weight:800;color:var(--ink)}
.tile-icon,.avatar{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:13px;background:var(--lav);color:var(--ink);font-weight:850;flex:none}
.tile-icon.mint,.avatar.mint{background:var(--mint)}
.tile-icon.sky{background:var(--sky)}
.tile-icon.yellow,.avatar.yellow{background:var(--butter)}
.home{padding-top:28px;padding-bottom:48px}
.workspace{display:grid;grid-template-columns:236px minmax(0,1fr);gap:25px;padding-top:25px;padding-bottom:40px}
.side{border:1px solid var(--line);background:white;border-radius:var(--r);padding:14px;position:sticky;top:16px;max-height:calc(100vh - 35px);overflow:auto}
.side-title{padding:8px 8px 13px;border-bottom:1px solid var(--line);margin-bottom:8px}
.side a{display:block;border-radius:10px;padding:9px 10px;font-size:.875rem;font-weight:700}
.side a:hover,.side a[aria-current]{background:var(--lav)}
.side .divider{margin:10px 0;border-top:1px solid var(--line)}
.stack{display:grid;gap:16px;align-content:start;min-width:0}
.compact{gap:9px}
.head{display:flex;justify-content:space-between;align-items:end;gap:15px;flex-wrap:wrap;margin-bottom:6px}
.head h1{margin:5px 0 6px}
.bread{font-size:.875rem;font-weight:700;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card{padding:20px;border:1px solid var(--line);border-radius:var(--r);background:white;box-shadow:var(--shadow);min-width:0}
.card.tinted{background:var(--lav);border-color:var(--lav-deep)}
.card.sky{background:var(--sky)}
.card.mint{background:var(--mint)}
.card p + p{margin-top:8px}
.split{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(235px,1fr);gap:16px;align-items:start}
.note{border-radius:13px;padding:11px 13px;background:var(--lav);font-size:.9rem}
.note strong{color:inherit}
.stepbar{display:flex;flex-wrap:wrap;gap:8px}
.stepbar a{flex:1 1 135px;padding:10px 12px;background:white;border:1px solid var(--line);border-radius:13px;font-size:.9rem;font-weight:750}
.stepbar a[aria-current]{border-color:#8774ca;background:var(--lav)}
.stepbar .done{background:var(--mint)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.row.start{justify-content:flex-start}
.rule{border:0;border-top:1px solid var(--line);margin:0}
.option{display:flex;align-items:center;gap:10px;border:1px solid var(--line);padding:12px;border-radius:12px}
.option:has(input:checked){background:var(--lav);border-color:#8c79c9}
audio{max-width:100%;height:42px}
.dialogue{background:var(--lav);border-radius:18px 18px 18px 4px;padding:13px}
.dialogue.you{background:var(--sky);border-radius:18px 18px 4px 18px;margin-left:13%}
.table-scroll{overflow:auto}
table{width:100%;border-collapse:collapse;text-align:left;font-size:.9rem}
th,td{padding:10px 9px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:750;color:var(--ink);background:#f8f7fc}
td a,details a,.text-link{font-weight:750;text-decoration:underline;text-underline-offset:3px}
tr.selected td{background:var(--lav)}
th:first-child,td:first-child{padding-left:12px}
.metric{background:#f8f7fc;border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0}
.metric b{display:block;font-size:1.65rem;line-height:1.15}
.timeline{list-style:none;margin:0;padding:0;display:grid;gap:9px}
.timeline li{display:grid;grid-template-columns:34px minmax(0,1fr) auto;align-items:center;gap:9px;padding:9px;border:1px solid var(--line);border-radius:13px}
.timeline li.active{background:var(--lav);border-color:#9b88d9}
.timeline .avatar{width:32px;height:32px;border-radius:10px;font-size:.875rem}
.timeline li p{line-height:1.25}
.history{border-left:2px solid #d9d0f6;margin:0 0 0 6px;padding-left:17px}
.history li{margin:7px 0}
.sheet{padding:18px;background:#faf9ff;border:1px solid var(--line);border-radius:13px}
blockquote{margin:3px 0 0;border-left:3px solid #c6b9ee;padding-left:11px;color:var(--muted);font-size:.9rem}
fieldset{margin:0;border:0;padding:0;min-width:0}
legend{margin-bottom:8px;font-weight:700;color:var(--ink)}
details summary{cursor:pointer;font-weight:760;color:var(--ink)}
details[open]>summary{margin-bottom:9px}
.linklist{list-style:none;padding:0;margin:0;display:grid;gap:5px}
.linklist a{display:block;border-radius:9px;padding:7px 8px;font-size:.875rem;background:#f8f7fc}
.linklist a:hover{background:var(--lav)}
.footer{background:white;border-top:1px solid var(--line)}
.foot-inner{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;min-height:64px}
.toast{position:fixed;z-index:10;bottom:16px;right:16px;background:var(--ink);color:white;border-radius:14px;padding:11px 16px;max-width:min(430px,calc(100% - 32px));box-shadow:var(--shadow)}
dialog{width:min(460px,calc(100% - 28px));padding:22px;border:1px solid var(--line);border-radius:var(--r);color:var(--text);box-shadow:var(--shadow)}
dialog::backdrop{background:#201d48a3}
@media(max-width:1050px){.workspace{grid-template-columns:190px minmax(0,1fr);gap:16px}.wrap{padding-inline:22px}.hero{min-height:360px}.split{grid-template-columns:minmax(0,1.4fr) minmax(205px,1fr)}}
@media(max-width:790px){.top-inner{padding-block:10px;flex-wrap:wrap;gap:8px}.nav{order:3;width:100%;flex-wrap:nowrap;overflow:auto}.nav a{white-space:nowrap}.workspace{grid-template-columns:minmax(0,1fr)}.side{position:static;max-height:none;display:flex;gap:2px;overflow:auto;padding:8px}.side-title,.side .divider{display:none}.side a{white-space:nowrap}.hero{padding:26px;gap:12px}.visual{min-height:216px}.tiles,.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:550px){.wrap{padding-inline:14px}.hero,.split,.grid2,.tiles,.grid3{grid-template-columns:minmax(0,1fr)}.hero h1{font-size:clamp(2.4rem,10vw,3.6rem)}.visual{min-height:200px}.tile{min-height:auto}.card{padding:14px}.section{margin-top:22px}.timeline li{grid-template-columns:30px minmax(0,1fr)}.timeline li>.pill{grid-column:2;justify-self:start}.head{align-items:start}}
@media(max-width:790px){.visual.has-art{min-height:245px}}
@media(max-width:550px){.visual.has-art{min-height:275px}}
@media print{.top,.side,.footer,.skip,.actions,.toast{display:none!important}.workspace{display:block;padding:0}.card{box-shadow:none}.wrap{max-width:none}.page{background:white}}
</style>

    const target = group.codes.includes(screen.id) ? screen.id : groupEntries[group.name] || group.codes[0];

function renderCatalogResults() {

const fieldsFrom = (heading, limit = 5) => (heading.split(":").slice(1).join(":") || "")
  .split(/[,;]|\s+\/\s+/).map(item=>item.trim()).filter(Boolean).slice(0,limit);
const sampleFor = (fieldName, screen) => {
  const key = Object.keys(demoValues).find(label => fold(fieldName).includes(fold(label)));
  return key ? demoValues[key] : examplesByPortal[screen.portal] || "Zenford · ZF-024";
};

function screenNeighbors(screen) {
  const group = data.nav.find(p=>p.portal === screen.portal)?.groups.find(g=>g.codes.includes(screen.id));
  const related = data.screens.filter(s => s.id !== screen.id && s.mod === screen.mod);
  const ids = [...new Set([...(group?.codes || []), ...related.map(s => s.id)])].filter(id=>id !== screen.id);
  return ids.map(id => screens.get(id));
}

function genericComponent(item, screen, neighbors) {
  const normalized = fold(item);
  const kind = item.split(":")[0];
  const description = item.slice(kind.length + 1).trim();
  const fields = fieldsFrom(item);
  if (/^(nut|cac nut|thanh nut)/.test(normalized)) {
    const labels = (fields.length ? fields : [item.replace(/^(Các nút|Thanh nút|Nút)\s*/i,"")]).filter(Boolean);
    return `<div class="actions">${labels.map(label => {
      const key = fold(label);
      const exact = neighbors.find(screen => fold(screen.name) === key);
      const begins = key.length >= 4 && neighbors.find(screen => fold(screen.name).startsWith(key + " "));
      const target = exact || begins;
      return target ? link(target.id,label) : button("generic", label);
    }).join("")}</div>`;
  }
  if (/^(bang|danh sach|luoi)/.test(normalized) && fields.length > 1) {
    return card(`<h3>${escape(kind)}</h3>${table(fields,[fields.map(f=>escape(sampleFor(f,screen)))])}`);
  }
  if (/^(truong|form|bo loc|loc|chon|tim kiem|o tim)/.test(normalized)) {
    const labels = fields.length ? fields : [item.replace(/^(Trường|Form|Bộ lọc|Lọc|Chọn|Tìm kiếm|Ô tìm)\s*/i,"") || kind];
    return card(`<div class="grid2">${labels.map(name => /^(bo loc|loc|chon)/.test(normalized)
      ? field(name, ["Chọn…",sampleFor(name,screen)])
      : `<label>${escape(name)}<input placeholder="${escape(sampleFor(name,screen))}"></label>`).join("")}</div>`);
  }
  return card(`<h3>${escape(description ? kind : item)}</h3>${description ? `<p>${escape(description)}</p>` : ""}<small>${escape(examplesByPortal[screen.portal] || "Dữ liệu mẫu Zenford")}</small>`);
}

function genericScreen(screen) {
  const neighbors = screenNeighbors(screen);
  const components = screen.el.map(item => genericComponent(item,screen,neighbors)).join("");
  const context = card(`<h3>Màn hình liên quan</h3><ul class="linklist">${neighbors.slice(0,10).map(s=>`<li><a href="#${s.id}">${escape(s.name)}</a></li>`).join("") || '<li><a href="#danh-muc">Danh mục màn hình</a></li>'}</ul>

  return workspace(screen, pageHeading(screen) + `<div class="split"><div class="stack">${components}</div>${context}</div>`);
}

function cvReview(screen) {
  const person = selectedCandidate();
  const edit = cv.edits[person.id];
  const decision = cv.decisions[person.id];
  const evidence = criteria.map(([title,max,desc],i) => {
    const score = person.scores[i];
    return `<div class="stack compact"><div class="row"><h3>${title}</h3>${pill(score===null?"Chưa có điểm":`${score}/${max}`,score===null?"warn":"gray")}</div>
      <small>${score===null?"Cần đối chiếu tệp gốc.":desc}</small><blockquote>${person.evidence[i]}</blockquote></div>`;
  }).join('<hr class="rule">');
  const original = card(`<div class="row"><h3>CV gốc</h3>${pill("Tệp mẫu","gray")}</div>
    <div class="sheet stack compact"><small>${person.file}</small><h3>${person.name}</h3><p>Ứng tuyển · Giáo viên tiếng Anh</p>
    <hr class="rule"><strong>Kinh nghiệm</strong><p>${person.experience}</p><strong>Học vấn &amp; chứng chỉ</strong><p>${person.degree}</p>
    <strong>Kỹ năng</strong><p>${person.skills.join(" · ") || "Chưa xác minh."}</p></div>`);
  return workspace(screen,pageHeading(screen,"AI review CV","Tuyển dụng · Giáo viên tiếng Anh trực tuyến",link("SCR-M29-03","Tiêu chí lọc CV"))
    + card(`<div class="row"><h2>Bảng xếp hạng</h2><label>Hiển thị<select id="cv-filter">${options(["Tất cả","Cần xem lại","Đã chấm"],cv.filter)}</select></label></div>
    <div id="cv-table">${cvRankTable()}</div><small>Rubric GV-ENG v1.2 · Ngưỡng mời mẫu 75/100 · Sát ngưỡng ±5 điểm</small>`)
    + card(`<div class="row"><div class="row start"><span class="avatar">${person.initial}</span><div><h2>${person.name}</h2><small>${person.id} · Giáo viên tiếng Anh</small></div></div>
    ${pill(decision?.status || (person.flag?"Cần xem lại":"AI đã chấm CV"),decision?.tone || (person.flag?"warn":"mint"))}</div>
    <div class="grid2">${metric(person.score===null?"—":`${person.score}/100`,"Điểm AI theo rubric")}${metric(edit?`${edit.score}/100`:"—","Điểm Nhân sự điều chỉnh")}</div>
    ${edit?note(`<strong>Lý do điều chỉnh</strong><br>${escape(edit.reason)}`):""}
    ${decision?note(`<strong>${escape(decision.status)}</strong><br>${escape(decision.reason)}`,decision.tone):""}
    <div class="actions">${button("cv-edit","Điều chỉnh điểm")}${button("cv-invite","Mời phỏng vấn AI","primary")}${button("cv-stop","Dừng hồ sơ","danger")}${link("SCR-M29-07","Xem pipeline ứng viên")}</div>`)
    + `<div class="grid2">${card(`<h2>Điểm và bằng chứng</h2>${evidence}`)}${original}</div>`);
}

function cvRubric(screen) {
  return workspace(screen,pageHeading(screen,"Tiêu chí lọc CV","Rubric GV-ENG v1.2 · Giáo viên tiếng Anh trực tuyến",link("SCR-M29-04","Về xếp hạng CV","primary"))
    + card(`<h2>Bộ tiêu chí đang dùng</h2>${table(["Tiêu chí","Mô tả","Trọng số","Bắt buộc"],criteria.map(([title,max,desc],i)=>[title,desc,`${max}%`,i===0?"Có":"—"]))}
    <div class="grid3">${metric("100%","Tổng trọng số")}${metric("75/100","Ngưỡng mời mẫu")}${metric("±5","Biên độ sát ngưỡng")}</div>`));
}

function cvJobs(screen) {
  return workspace(screen,pageHeading(screen,"Tin tuyển dụng","Nhân sự · Tuyển dụng AI",link("SCR-M29-01","Xem trang ứng tuyển"))
    + card(`<h2>Vị trí tuyển dụng</h2>${table(["Vị trí","Hồ sơ mẫu","Trạng thái"],[
      ['<a href="#SCR-M29-04">Giáo viên tiếng Anh trực tuyến</a>',"3 hồ sơ",pill("Đang tuyển","mint")],
      ["Chuyên viên học thuật","0 hồ sơ",pill("Nháp","gray")]])}
    <div class="actions">${link("SCR-M29-04","Xem bảng xếp hạng","primary")}${link("SCR-M29-03","Tiêu chí lọc CV")}</div>`));
}

function cvApplication(screen) {
  return workspace(screen,pageHeading(screen,"Ứng tuyển giáo viên tiếng Anh","Dạy trực tuyến · Chương trình giao tiếp A2")
    + `<form id="application-form">${card(`<h2>Hồ sơ ứng tuyển</h2><div class="grid2">
    <label>Họ và tên<input required autocomplete="off" placeholder="Nguyễn An"></label>
    <label>Email<input required type="email" autocomplete="off" placeholder="nguyen.an@example.test"></label></div>
    <p class="note">Biểu mẫu trình diễn dùng CV-024.pdf mẫu.</p>
    <label class="inline"><input type="checkbox" required>Tôi đồng ý với bước xử lý dữ liệu minh họa trong bản mẫu.</label>
    <div class="actions"><button class="button primary" type="submit">Gửi hồ sơ mẫu</button>${link("SCR-M29-04","Xem kết quả mẫu")}</div>`)}</form>`);
}

function cvPipeline(screen) {
  return workspace(screen,pageHeading(screen,"Pipeline ứng viên","Giáo viên tiếng Anh trực tuyến",link("SCR-M29-04","Về xếp hạng CV","primary"))
    + card(`<h2>Tiến trình tuyển dụng</h2>${table(["Ứng viên","Trạng thái","Ghi nhận của Nhân sự"],candidates.map(person=>{
      const record=cv.decisions[person.id];
      return [`<a href="#SCR-M29-04" data-candidate="${person.id}">${person.name}</a>`,pill(record?.status || "AI đã chấm CV",record?.tone || "gray"),escape(record?.reason || "—")];
    }))}<div class="actions">${link("SCR-M29-05","Bộ câu hỏi phỏng vấn")}${link("SCR-M29-06","Phiên phỏng vấn AI mẫu")}</div>`));
}

const custom = {
  "SCR-M08-01":home, "SCR-M08-03":publicPrograms, "SCR-M08-04":publicProgram,
  "SCR-M42-01":preHome, "SCR-M42-02":preLesson, "SCR-M42-03":preLesson, "SCR-M42-04":preLesson,
  "SCR-M42-05":preTeacher, "SCR-M42-07":preReport, "SCR-M42-08":preReport, "SCR-M45-07":preNotebook,
  "SCR-M16-01":academicList, "SCR-M16-03":academicList, "SCR-M16-04":academicBrief, "SCR-M16-08":academicLibrary,
  "SCR-M17-03":agentSettings, "SCR-M17-04":academicPipeline, "SCR-M17-05":academicResearch,
  "SCR-M17-06":academicComparison, "SCR-M17-07":reviewAcademic, "SCR-M17-08":reviewAcademic,
  "SCR-M29-01":cvApplication, "SCR-M29-02":cvJobs, "SCR-M29-03":cvRubric, "SCR-M29-04":cvReview, "SCR-M29-07":cvPipeline
};

function render(viewChanged = false) {
  const id = location.hash.slice(1) || "SCR-M08-01";
  if (id === "main") return;
  const screen = screens.get(id);
  const active = routeFamily(id);
  document.getElementById("top-nav").innerHTML = shortcuts.map(([target,name]) =>
    `<a href="#${target}"${active && active===routeFamily(target)?' aria-current="location"':""}>${name}</a>`).join("");
  if (id === "danh-muc") {
    main.innerHTML = catalog();
    renderCatalogResults();
  } else if (id === "pre-done") main.innerHTML = preDone();
  else if (screen) main.innerHTML = (custom[id] || genericScreen)(screen);
  else main.innerHTML = `<div class="wrap home">${card(`<h1>Không tìm thấy màn hình</h1>${link("danh-muc","Mở danh mục","primary")}`)}</div>`;
  document.title = `Zenford · ${main.querySelector("h1")?.textContent || "Bản mẫu giao diện"}`;
  if (viewChanged) {
    toast.hidden = true;
    window.scrollTo({top:0});
    main.focus({preventScroll:true});
  }
}

function flash(text) {
  toast.textContent = text;
  toast.hidden = false;
  clearTimeout(flash.timeout);
  flash.timeout = setTimeout(()=>{toast.hidden=true},3500);
}

function updateView(control) {
  const action = control.dataset.action;
  render();
  const replacement = [...main.querySelectorAll("[data-action]")].find(item =>
    item.dataset.action === action && item.dataset.id === control.dataset.id);
  (replacement || main).focus({preventScroll:true});
}

function go(id) {
  if (location.hash === "#" + id) render();
  else location.hash = id;
}

const pipelineEvent = text => academic.history.push(text);
function advancePipeline() {
  const previous = academic.active;
  pipelineEvent(`${pipelineSteps[previous][1]} hoàn thành ${pipelineSteps[previous][0].toLowerCase()}.`);
  academic.active++;
  academic.mode = "ready";
  pipelineEvent(`Bàn giao cho ${pipelineSteps[academic.active][1]}.`);
}

let decisionHandler;
function openDecision(title, label, callback, {score = false, hint = ""} = {}) {
  document.getElementById("decision-title").textContent = title;
  const person = selectedCandidate();
  document.getElementById("decision-fields").innerHTML = `${hint ? `<p class="subtle">${escape(hint)}</p>` : ""}
    ${score ? `<label>Điểm Nhân sự / 100<input type="number" name="score" required min="0" max="100" value="${cv.edits[person.id]?.score ?? person.score ?? ""}"></label>` : ""}
    <label>${escape(label)}<textarea name="reason" required rows="3" maxlength="300"></textarea></label>`;
  decisionHandler = callback;
  dialog.showModal();
}

const actions = {
  "generic":()=>flash("Đây là thao tác minh họa. Xem màn hình liên quan để tiếp tục."),
  "program-filter":control=>{programFilter=control.dataset.id;return true},
  "close-dialog":()=>dialog.close(),
  "pre-reset":()=>{preState.question=0;preState.answer="";preState.responded=false;return true},
  "pre-record":()=>{preState.answer="sample";return true},
  "pre-check":()=>{
    if (!preState.answer.trim()) return flash("Em hãy trả lời câu hỏi trước.");
    preState.responded=true;return true;
  },
  "pre-next":()=>{preState.question++;preState.answer="";preState.responded=false;return true},
  "pre-alternate":()=>{preState.alternate=!preState.alternate;return true},
  "pre-transcript":()=>{preState.transcript=!preState.transcript;return true},
  "pre-teacher-flag":()=>{preState.teacherFlag=true;flash("Đã ghi chú mẫu Cần giáo viên.")},
  "pre-practice":()=>{preState.spoken=!preState.spoken;return true},
  "pre-complete":()=>{preState.complete=true;go("pre-done")},
  "academic-run":()=>{
    if (academic.mode==="revise") academic.revision++;
    academic.mode="running";
    pipelineEvent(`${pipelineSteps[academic.active][1]} bắt đầu bản v${academic.revision}.`);
    return true;
  },
  "academic-next":()=>{
    if (academic.active<3) {
      academic.mode="gate";
      pipelineEvent(`${pipelineSteps[academic.active][1]} nộp đầu ra cho chuyên gia.`);
    } else advancePipeline();
    return true;
  },
  "academic-approve-gate":()=>{pipelineEvent("Chuyên gia duyệt đầu ra.");advancePipeline();return true},
  "academic-return-ai":()=>{
    const from = academic.active;
    const to = from === 4 ? 3 : from;
    academic.returnReason = from===4 ? "Audio câu 3 thiếu từ “please” so với kịch bản. Tạo lại riêng câu này." :
      from===2 ? "Bổ sung một lượt thoại cho vai khách để đủ mục tiêu luyện nói." : "Bổ sung tiêu chí đạt cho khối luyện nói.";
    academic.active=to;
    academic.mode="revise";
    pipelineEvent(`AI kiểm định trả về ${pipelineSteps[to][0]}. ${academic.returnReason}`);
    return true;
  },
  "academic-return-human":()=>{
    openDecision("Trả về để chỉnh sửa","Lý do trả về",({reason})=>{
      const from=academic.active;
      academic.active=from===5?3:from;
      academic.reviewed=false;
      academic.mode="revise";academic.returnReason=reason;
      pipelineEvent(`Chuyên gia trả về ${pipelineSteps[academic.active][0]}. ${reason}`);
      go("SCR-M17-04");
    });
  },
  "academic-manual":()=>{academic.reviewed=true;pipelineEvent("Chuyên gia hoàn tất kiểm định thủ công. Chờ Trưởng Học thuật phê duyệt.");return true},
  "academic-final":()=>{academic.approved=true;pipelineEvent("Trưởng Học thuật phê duyệt học liệu.");go("SCR-M17-04")},
  "cv-select":control=>{cv.selected=control.dataset.id;return true},
  "cv-edit":()=>{
    const person=selectedCandidate();
    openDecision("Điều chỉnh điểm CV","Lý do điều chỉnh",({score,reason})=>{
      cv.edits[person.id]={score,reason};render();
    },{score:true,hint:`Giữ điểm AI gốc của ${person.name} trong hồ sơ mẫu.`});
  },
  "cv-invite":()=>{
    const person=selectedCandidate();
    openDecision("Mời phỏng vấn AI","Ghi chú của Nhân sự",({reason})=>{
      cv.decisions[person.id]={status:"Mời phỏng vấn AI",tone:"mint",reason};render();
    },{hint:"Ghi nhận bước tiếp theo trong pipeline mẫu."});
  },
  "cv-stop":()=>{
    const person=selectedCandidate();
    openDecision("Dừng hồ sơ","Lý do dừng",({reason})=>{
      cv.decisions[person.id]={status:"Dừng",tone:"red",reason};render();
    });
  }
};

document.addEventListener("click",event=>{
  if (event.target.closest(".skip")) {
    event.preventDefault();
    main.focus();
    return;
  }
  const candidate = event.target.closest("[data-candidate]");
  if (candidate) cv.selected = candidate.dataset.candidate;
  const language = event.target.closest("[data-language]");
  if (language) programFilter = language.dataset.language;
  const program = event.target.closest("[data-program]");
  if (program) programCode = program.dataset.program;
  const control = event.target.closest("[data-action]");
  if (control && actions[control.dataset.action]?.(control)) updateView(control);
});

document.addEventListener("input",({target})=>{
  if (target.id==="catalog-query") renderCatalogResults();
  if (target.id==="pre-answer" || target.name==="quiz-option") preState.answer=target.value;
  if (target.id==="pre-explanation") preState.explanation=target.value;
});

const modelPair = key => key.startsWith("branch-") ? academic.branchModels[Number(key.slice(7))] : academic.models[Number(key)];
document.addEventListener("change",({target})=>{
  if (target.id==="catalog-portal") renderCatalogResults();
  if (target.name==="source") document.getElementById("source-warning").hidden=target.selectedIndex===0;
  if (target.id==="pre-roster") {
    document.querySelectorAll("#pre-roster-table tbody tr").forEach(row=>{
      row.hidden=target.value!=="Tất cả" && row.cells[1].textContent!==target.value;
    });
  }
  if (target.id==="cv-filter") {
    cv.filter=target.value;
    document.getElementById("cv-table").innerHTML=cvRankTable();
  }
  if (target.dataset.provider!==undefined) {
    const key=target.dataset.provider;
    const pair=modelPair(key);
    pair[0]=target.value;
    const models=providerModels[pair[0]];
    pair[1]=models[0];
    document.querySelector(`[data-model="${key}"]`).innerHTML=options(models,pair[1]);
  }
  if (target.dataset.model!==undefined) modelPair(target.dataset.model)[1]=target.value;
});

document.addEventListener("submit",event=>{
  const form=event.target;
  if (form.id==="decision-form") {
    event.preventDefault();
    const values=Object.fromEntries(new FormData(form));
    values.reason=values.reason.trim();
    if (!values.reason) return flash("Vui lòng nhập lý do hoặc ghi chú.");
    dialog.close();
    decisionHandler(values);
  }
  if (form.id==="brief-form") {
    event.preventDefault();
    const values=Object.fromEntries(new FormData(form));
    values.topic=values.topic.trim();
    values.output=values.output.trim();
    if (!values.topic || !values.output) return flash("Vui lòng nhập chủ đề và đầu ra.");
    if (form.elements.source.selectedIndex!==0) return flash("Chọn nguồn đã xác nhận quyền sử dụng.");
    Object.assign(academic,values,{active:0,mode:"ready",revision:1,returnReason:"",reviewed:false,approved:false,history:[`Đã giao đề bài “${values.topic}” cho AI Trưởng phòng.`]});
    go("SCR-M17-04");
  }
  if (form.id==="application-form") {
    event.preventDefault();
    cv.selected="CV-024";
    window.addEventListener("hashchange",()=>flash("Đã gửi hồ sơ mẫu."),{once:true});
    go("SCR-M29-04");
  }
});

window.addEventListener("hashchange",()=>render(true));
render();
</script>
