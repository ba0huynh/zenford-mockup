<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cổng học viên Zenford</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>:root{
  --ink:#141414;--paper:#FFFFFF;--soft:#F6F7F9;--line:#E4E7EE;--muted:#555B68;
  --mint:#BDEFD8;--lav:#D8CCFF;--peach:#FFD2B8;--sky:#BFE4FF;--butter:#FFF1A8;--yel:#FDE047;--yelp:#EFD33A;
  --good:#167A53;--goodbg:#DDF5EA;--bad:#B4382F;--badbg:#FDE3E0;
  --f-d:"Bricolage Grotesque","Be Vietnam Pro",system-ui,sans-serif;
  --f-b:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --rail:76px;--open:256px;--spring:cubic-bezier(.3,1.45,.5,1);
  --st:4px 4px 0 #141414;--st-sm:3px 3px 0 #141414;
  color-scheme:light;
}
:root[data-night],:root[data-theme="dark"]{--paper:#15171C;--soft:#1D2027;--line:#2C303A;--ink:#F2F3F5;--muted:#A6ABB8;--goodbg:#1C3A2E;--good:#7FD9AE;--badbg:#3D2220;--bad:#F2A097;color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#15171C;--soft:#1D2027;--line:#2C303A;--ink:#F2F3F5;--muted:#A6ABB8;--goodbg:#1C3A2E;--good:#7FD9AE;--badbg:#3D2220;--bad:#F2A097;color-scheme:dark}}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-b);font-size:15.5px;line-height:1.5;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px;border-radius:8px}
h1,h2,h3,h4{font-family:var(--f-d);letter-spacing:-.025em;margin:0;line-height:1.12}
p{margin:0}
.muted{color:var(--muted)}
.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- demo bar (only for review) ---------- */
.demo{position:fixed;top:0;left:0;right:0;z-index:60;height:34px;background:#141414;color:#fff;display:flex;align-items:center;gap:12px;padding:0 12px 0 calc(var(--rail) + 12px);font-size:12.5px;font-weight:600}
.demo b{color:var(--yel)}
.demo .sp{flex:1}
.demo button{color:#fff;border:1.5px solid #555;border-radius:8px;padding:3px 10px;font-weight:700;font-size:12px}
.demo button:hover{border-color:var(--yel);color:var(--yel)}
.demo .scr{font-family:ui-monospace,Menlo,monospace;color:#BDEFD8}
@media (max-width:760px){.demo{padding-left:12px;gap:8px}.demo .hide-m{display:none}.demo button{padding:2px 7px;white-space:nowrap}}

/* ---------- rail ---------- */
.app{display:grid;grid-template-columns:var(--rail) 1fr;min-height:100vh;padding-top:34px}
.rail{position:fixed;top:34px;bottom:0;left:0;width:var(--rail);z-index:40;background:var(--paper);border-right:2.5px solid var(--ink);display:flex;flex-direction:column;gap:4px;padding:12px 12px 12px;transition:width .42s var(--spring),box-shadow .3s,background .3s;overflow:hidden}
.rail:hover,.rail.pinned{width:var(--open);box-shadow:6px 0 0 var(--ink)}
.rtop{display:flex;align-items:center;justify-content:space-between;min-height:44px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-d);font-weight:800;font-size:22px;letter-spacing:-.03em;padding-left:7px;white-space:nowrap}
.pin{width:30px;height:30px;border-radius:9px;border:2px solid var(--ink);display:grid;place-items:center;flex:none;opacity:0;transition:opacity .2s}
.pin svg{width:16px;height:16px;fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.pin[aria-pressed="true"]{background:var(--yel)}.pin[aria-pressed="true"] svg{stroke:#141414}
.rail:hover .pin,.rail.pinned .pin{opacity:1}
.lbl{white-space:nowrap;opacity:0;transform:translateX(-8px);transition:opacity .2s,transform .3s var(--spring)}
.rail:hover .lbl,.rail.pinned .lbl{opacity:1;transform:none;transition-delay:calc(var(--i,0) * 22ms + 70ms)}
.who{display:flex;align-items:center;gap:10px;padding:6px 3px;margin:2px 0 4px;border-radius:14px;width:100%;text-align:left}
.who:hover{background:var(--soft)}
.av{width:42px;height:42px;border-radius:50%;border:2.5px solid var(--ink);background:var(--sky);color:#141414;display:grid;place-items:center;font-weight:800;font-size:13px;flex:none;position:relative}
.av .fl{position:absolute;right:-5px;bottom:-5px;width:20px;height:20px;border-radius:50%;background:var(--paper);border:2px solid var(--ink);font-size:10px;display:grid;place-items:center;font-weight:800;color:var(--ink)}
.who b{display:block;font-size:14px}.who small{color:var(--muted);font-size:12px;display:block}
nav.nav{position:relative;display:grid;gap:2px}
.grp{font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding:8px 12px 0;height:24px}
.it{position:relative;z-index:1;display:flex;align-items:center;gap:13px;height:44px;padding:0 12px;border-radius:14px;border:2px solid transparent;font-weight:700;font-size:14.5px;width:100%;text-align:left;transition:transform .25s var(--spring),background .2s,border-color .2s,box-shadow .2s}
.it.on{background:var(--yel);border-color:#141414;color:#141414;box-shadow:var(--st-sm)}
.it:not(.on):hover{transform:translateY(-2px);border-color:var(--ink);box-shadow:var(--st-sm);background:var(--lab,var(--butter));color:#141414}
.it:not(.on):hover .ic svg{stroke:#141414}
.it:active{transform:translate(2px,2px)!important;box-shadow:none!important}
.badge{margin-left:auto;font-style:normal;font-size:11px;font-weight:800;background:var(--ink);color:var(--paper);border-radius:999px;padding:1px 8px;opacity:0;transition:opacity .2s}
.rail:hover .badge,.rail.pinned .badge{opacity:1}
.it .dot{position:absolute;top:-2px;right:-4px;width:10px;height:10px;border-radius:50%;background:var(--yel);border:2px solid var(--ink);animation:ping 2.4s infinite}
@keyframes ping{0%,70%,100%{transform:scale(1)}80%{transform:scale(1.45)}90%{transform:scale(.9)}}
.tip{position:fixed;z-index:70;background:#141414;color:#fff;font-weight:800;font-size:13px;padding:6px 11px;border-radius:10px;pointer-events:none;opacity:0;transform:translateX(-6px) scale(.9);transition:opacity .15s,transform .25s var(--spring);white-space:nowrap}
.tip.show{opacity:1;transform:none}
.peek{margin-top:auto;height:70px;position:relative;overflow:hidden;flex:none}
.peek .zz{position:absolute;left:2px;bottom:-120px;width:62px;transition:bottom .5s var(--spring)}
.rail:hover .peek .zz,.rail.pinned .peek .zz{bottom:-6px}
.rfoot{border-top:2px dashed var(--line);padding-top:6px;display:grid;gap:2px}
.ic{width:26px;height:26px;flex:none;display:grid;place-items:center;position:relative}
.ic svg{width:25px;height:25px;fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;overflow:visible}
.it.on .ic svg{stroke:#141414}
.ic svg *{transform-box:fill-box;transform-origin:center}
.rail:not(:hover):not(.pinned) .it .ic{animation:floaty 3.4s ease-in-out infinite;animation-delay:calc(var(--i,0) * -.45s)}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}
.it:hover [data-a="roof"]{animation:hop .5s var(--spring)}
@keyframes hop{0%{transform:translateY(0)}40%{transform:translateY(-4px)}100%{transform:translateY(0)}}
.it:hover [data-a="tick"]{animation:draw .5s ease forwards}
[data-a="tick"]{stroke-dasharray:20}
@keyframes draw{from{stroke-dashoffset:20}to{stroke-dashoffset:0}}
.it:hover [data-a="wave"]{animation:wave .6s ease-in-out infinite alternate}
@keyframes wave{from{opacity:.2;transform:scale(.8)}to{opacity:1;transform:scale(1.1)}}
.it:hover [data-a="mic"],.it:hover [data-a="bell"]{animation:shake .35s ease-in-out 2}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
.it:hover [data-a="page"]{animation:flip .7s ease-in-out}
[data-a="page"]{transform-origin:left center!important}
@keyframes flip{0%,100%{transform:scaleX(1)}50%{transform:scaleX(-1)}}
.it:hover [data-a="flag"]{animation:flutter .5s ease-in-out 3 alternate}
[data-a="flag"]{transform-origin:left center!important}
@keyframes flutter{to{transform:skewY(-8deg) scaleX(.85)}}
.it:hover [data-a="d"]{animation:hop .5s var(--spring) infinite}
.it:hover [data-a="d"]:nth-of-type(3){animation-delay:.12s}.it:hover [data-a="d"]:nth-of-type(4){animation-delay:.24s}
.it:hover [data-a="spin"]{animation:spin .8s var(--spring)}
@keyframes spin{to{transform:rotate(360deg)}}
.it:hover [data-a="bar"]{animation:grow .5s var(--spring)}
.it:hover [data-a="bar"]:nth-of-type(2){animation-delay:.08s}.it:hover [data-a="bar"]:nth-of-type(3){animation-delay:.16s}
[data-a="bar"]{transform-origin:bottom center!important}
@keyframes grow{0%{transform:scaleY(.2)}100%{transform:scaleY(1)}}

/* ---------- main ---------- */
.main{grid-column:2;min-width:0}
.top{position:sticky;top:34px;z-index:30;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(8px);display:flex;align-items:center;gap:10px;padding:14px max(16px,3vw);border-bottom:2px solid var(--line)}
.crumb{font-size:13px;font-weight:700;color:var(--muted);display:flex;gap:6px;align-items:center;min-width:0}
.crumb b{color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:7px;border:2px solid var(--ink);border-radius:999px;padding:5px 12px;font-weight:800;font-size:13px;background:var(--paper);white-space:nowrap}
.chip svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round}
.ibtn{width:38px;height:38px;border-radius:12px;border:2px solid var(--ink);display:grid;place-items:center;position:relative;background:var(--paper);flex:none}
.ibtn svg{width:19px;height:19px;fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.ibtn .n{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;border-radius:9px;background:var(--yel);border:2px solid #141414;color:#141414;font-size:10px;font-weight:800;display:grid;place-items:center;padding:0 3px}
.ibtn:hover{background:var(--butter)}.ibtn:hover svg{stroke:#141414}
.page{padding:26px max(16px,3vw) 120px;max-width:1180px;display:grid;gap:26px;align-content:start;animation:pin .45s var(--spring)}
@keyframes pin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.ey{font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.ph h1{font-size:clamp(28px,3.4vw,40px);font-weight:800;margin-top:6px;max-width:24ch}
.ph p{color:var(--muted);margin-top:8px;max-width:60ch}
.g{display:grid;gap:18px}
.g2{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr)}
.g2e{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1020px){.g2,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){.g2,.g2e,.g3{grid-template-columns:1fr}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}#tlist .li{flex-wrap:wrap}#tlist .li .bd{flex:1 1 55%}#tlist .li .tag,.grip,.demo .scr{display:none}.num{font-size:28px}}
.col{display:grid;gap:18px;align-content:start}

/* cards */
.c{border:2px solid var(--line);border-radius:20px;padding:20px;background:var(--paper);display:grid;gap:12px;align-content:start;min-width:0}
.c h2{font-size:21px}.c h3{font-size:17px}
.c.k{border:2.5px solid var(--ink);box-shadow:var(--st)}
.c.fill{border:2.5px solid #141414;box-shadow:var(--st);color:#141414}
.c.fill .muted,.c.fill .ey{color:#3F4350}
.bg-mint{background:var(--mint)}.bg-sky{background:var(--sky)}.bg-lav{background:var(--lav)}.bg-peach{background:var(--peach)}.bg-butter{background:var(--butter)}.bg-yel{background:var(--yel)}.bg-soft{background:var(--soft)}
.ch{display:flex;justify-content:space-between;align-items:center;gap:10px}
.lk{font-weight:800;font-size:13.5px;border-bottom:3px solid var(--yel);padding-bottom:1px;white-space:nowrap}
.lk:hover{background:var(--yel);color:#141414}
.lift{transition:transform .25s var(--spring),box-shadow .25s}
.lift:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--ink)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:800;font-size:14.5px;padding:11px 18px;border-radius:14px;border:2.5px solid #141414;background:var(--yel);color:#141414;box-shadow:var(--st-sm);transition:transform .1s,box-shadow .1s,background .15s;white-space:nowrap}
.btn:hover{background:var(--yelp)}
.btn:active{transform:translate(3px,3px);box-shadow:none}
.btn.o{background:var(--paper);color:var(--ink);border-color:var(--ink);box-shadow:none}
.btn.o:hover{background:var(--soft)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:11px}
.btn.big{padding:14px 24px;font-size:16px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;border-radius:999px;padding:3px 10px;background:var(--soft);color:var(--ink);white-space:nowrap}
.tag.ink{background:var(--ink);color:var(--paper)}
.tag.ok{background:var(--goodbg);color:var(--good)}
.tag.warn{background:var(--butter);color:#5A4A00}
.tag.bad{background:var(--badbg);color:var(--bad)}
.tag.line{background:none;border:1.5px solid var(--ink)}
.tag.mint{background:var(--mint);color:#141414}.tag.sky{background:var(--sky);color:#141414}.tag.lav{background:var(--lav);color:#141414}.tag.peach{background:var(--peach);color:#141414}
.bar{height:10px;border-radius:99px;background:var(--soft);border:1.5px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);border-radius:99px;transition:width .9s var(--spring)}
.bar.g i{background:var(--good)}
.num{font-family:var(--f-d);font-weight:800;font-size:34px;letter-spacing:-.03em;line-height:1}
.stat{display:grid;gap:4px}
.stat small{color:var(--muted);font-size:13px}

/* list rows */
.li{display:flex;gap:14px;align-items:center;padding:14px;border:2px solid var(--line);border-radius:16px;background:var(--paper);transition:border-color .2s,transform .25s var(--spring),box-shadow .25s;min-width:0}
a.li:hover,button.li:hover{border-color:var(--ink);transform:translate(-2px,-2px);box-shadow:var(--st-sm)}
.li .bd{flex:1;min-width:0}
.li b{display:block;font-size:15px}
.li small{color:var(--muted);font-size:13px;display:block}
.sq{width:44px;height:44px;border-radius:13px;border:2px solid #141414;display:grid;place-items:center;flex:none;color:#141414;font-weight:800}
.sq svg{width:22px;height:22px;fill:none;stroke:#141414;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.li.done{opacity:.55}.li.done b{text-decoration:line-through}
.grip{color:var(--muted);cursor:grab;font-size:18px;line-height:1;user-select:none}

/* Zen say */
.zs{display:flex;gap:14px;align-items:flex-start}
.zs .zz{width:64px;flex:none}
.bub{position:relative;background:var(--paper);border:2.5px solid var(--ink);border-radius:18px;padding:12px 16px;font-weight:600;box-shadow:var(--st-sm)}
.bub::before{content:"";position:absolute;left:-10px;top:18px;width:14px;height:14px;background:inherit;border-left:2.5px solid var(--ink);border-bottom:2.5px solid var(--ink);transform:rotate(45deg)}
.zz svg{display:block;width:100%;height:auto}

/* notch card */
.notchwrap{position:relative;display:grid}
.notch{-webkit-mask:radial-gradient(circle 36px at calc(100% - 12px) calc(100% - 12px),transparent 35px,#000 36px);mask:radial-gradient(circle 36px at calc(100% - 12px) calc(100% - 12px),transparent 35px,#000 36px);box-shadow:none!important;padding-bottom:34px}
.round{position:absolute;right:-14px;bottom:-14px;width:54px;height:54px;border-radius:50%;border:2.5px solid #141414;background:var(--yel);font-weight:800;font-size:22px;color:#141414;box-shadow:var(--st-sm);transition:transform .3s var(--spring);display:grid;place-items:center}
.round:hover{transform:rotate(-45deg) scale(1.08)}

/* segmented */
.seg{justify-self:start;display:inline-flex;border:2px solid var(--ink);border-radius:14px;padding:3px;gap:3px;background:var(--paper);flex-wrap:wrap}
.seg button{padding:7px 14px;border-radius:10px;font-weight:800;font-size:13.5px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.seg button:not([aria-pressed="true"]):hover{background:var(--soft)}

/* ring */
.ring{position:relative;width:112px;height:112px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:10}
.ring .bgc{stroke:var(--soft)}
.ring .fg{stroke:var(--ink);stroke-linecap:round;transition:stroke-dashoffset 1s var(--spring)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-d);font-size:24px;text-align:center;line-height:1;align-content:center}
.ring b small{display:block;font-family:var(--f-b);font-size:10.5px;margin-top:3px;color:var(--muted);font-weight:700}

/* blocks (khối năng lực) */
.kgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:560px){.kgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.kb{border:2px solid var(--line);border-radius:16px;padding:12px;display:grid;gap:6px;text-align:left;min-height:118px;align-content:start;transition:transform .25s var(--spring),box-shadow .25s,border-color .2s;background:var(--paper)}
.kb:hover{transform:translate(-2px,-2px);border-color:var(--ink);box-shadow:var(--st-sm)}
.kb .kn{font-family:var(--f-d);font-weight:800;font-size:22px;line-height:1}
.kb b{font-size:13px;line-height:1.3}
.kb.dat{background:var(--mint);border-color:#141414;color:#141414}
.kb.luyen{background:var(--yel);border-color:#141414;color:#141414;box-shadow:var(--st-sm)}
.kb.giup{background:var(--peach);border-color:#141414;color:#141414}
.kb.khoa{opacity:.55}
.kb[aria-pressed="true"]{outline:3px solid var(--ink);outline-offset:3px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;font-weight:700;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;border:1.5px solid #141414;vertical-align:-1px;margin-right:5px}

/* week calendar */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.day{border:2px solid var(--line);border-radius:16px;padding:10px;min-height:220px;display:grid;gap:6px;align-content:start}
.day.today{border-color:var(--ink);box-shadow:var(--st-sm)}
.day h4{font-size:14px;font-family:var(--f-b);font-weight:800;display:flex;justify-content:space-between}
.ev{border-radius:11px;padding:7px 8px;font-size:12px;font-weight:700;line-height:1.3;border:1.5px solid #141414;color:#141414;text-align:left}
.ev b{display:block;font-size:11px;opacity:.75}
.ev.cls{background:var(--sky)}.ev.pre{background:var(--mint)}.ev.due{background:var(--butter)}.ev.free{background:none;border-style:dashed;color:var(--muted);border-color:var(--muted)}
@media (max-width:900px){.week{grid-template-columns:repeat(2,minmax(0,1fr))}.day{min-height:0}}

/* exercise */
.qbox{border:2.5px solid var(--ink);border-radius:24px;padding:clamp(18px,3vw,34px);box-shadow:var(--st);display:grid;gap:20px;background:var(--paper)}

.blank.fillx{border-bottom-style:solid;color:var(--ink);background:var(--butter);border-radius:8px 8px 0 0;padding:0 10px}
.opts{display:flex;gap:12px;flex-wrap:wrap}
.opt{border:2.5px solid var(--ink);border-radius:14px;padding:11px 20px;font-weight:800;font-size:17px;background:var(--paper);box-shadow:var(--st-sm);transition:transform .2s var(--spring),background .2s}
.opt:hover{transform:translateY(-3px) rotate(-1deg)}
.opt[aria-pressed="true"]{background:var(--yel);color:#141414}
.opt.right{background:var(--mint);color:#141414}.opt.wrong{background:var(--peach);color:#141414;animation:shake .3s 2}
.fb{border-radius:16px;padding:14px 16px;font-weight:600;display:flex;gap:12px;align-items:flex-start}
.fb.hint{background:var(--soft)}
.fb.ok{background:var(--goodbg);color:var(--good)}
.fb.no{background:var(--badbg);color:var(--bad)}
.steps{display:flex;gap:6px}
.steps i{flex:1;height:8px;border-radius:9px;background:var(--soft);border:1.5px solid var(--line)}
.steps i.on{background:var(--ink);border-color:var(--ink)}.steps i.done{background:var(--good);border-color:var(--good)}

/* chat */
.chat{display:grid;gap:14px;align-content:start}
.msg{max-width:76%;padding:12px 16px;border-radius:18px;font-weight:500;line-height:1.5;animation:pin .35s var(--spring)}
.msg.z{background:var(--soft);border-top-left-radius:6px}
.msg.me{background:var(--ink);color:var(--paper);justify-self:end;border-top-right-radius:6px}
.msg .hl{background:var(--yel);color:#141414;border-radius:5px;padding:0 4px;font-weight:700}
.zrow{display:flex;gap:10px;align-items:flex-start}
.zrow .zz{width:42px;flex:none}
.sugg{display:flex;gap:8px;flex-wrap:wrap}
.sugg button{border:2px solid var(--ink);border-radius:999px;padding:7px 14px;font-weight:700;font-size:13.5px;background:var(--paper);transition:background .15s,transform .2s var(--spring)}
.sugg button:hover{background:var(--butter);color:#141414;transform:translateY(-2px)}
.typing i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted);margin:0 2px;animation:hop .9s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
.inp{display:flex;gap:8px;border:2.5px solid var(--ink);border-radius:16px;padding:6px 6px 6px 14px;background:var(--paper)}
.inp input{flex:1;border:0;outline:none;background:none;min-width:0}

/* lab */
.labs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
@media (max-width:1020px){.labs{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.labs{grid-template-columns:1fr}}
.lab{border:2.5px solid #141414;border-radius:22px;padding:18px;display:grid;gap:10px;align-content:start;color:#141414;box-shadow:var(--st);transition:transform .25s var(--spring),box-shadow .25s;text-align:left;min-height:250px}
.lab:hover{transform:translate(-3px,-3px) rotate(-.6deg);box-shadow:8px 8px 0 #141414}
.lab .lic{width:52px;height:52px;border-radius:15px;background:#fff;border:2.5px solid #141414;display:grid;place-items:center}
.lab .lic svg{width:28px;height:28px;fill:none;stroke:#141414;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.lab h3{font-size:22px}
.lab .sug{background:rgba(255,255,255,.65);border-radius:12px;padding:9px 11px;font-size:13px;font-weight:600}
.lab .sug b{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;opacity:.7}
.clock{position:fixed;right:22px;bottom:22px;z-index:45;display:flex;align-items:center;gap:10px;background:#141414;color:#fff;border-radius:999px;padding:8px 10px 8px 16px;box-shadow:4px 4px 0 var(--yel);font-weight:800;animation:bob 3s ease-in-out infinite}
.clock b{font-variant-numeric:tabular-nums;font-size:18px;color:var(--yel)}
.clock button{background:var(--yel);color:#141414;border-radius:999px;padding:6px 12px;font-weight:800;font-size:13px}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.wave{display:flex;gap:4px;align-items:center;height:56px}
.wave i{width:6px;border-radius:4px;background:var(--ink);height:20%;transition:height .12s}
.rec{width:76px;height:76px;border-radius:50%;border:3px solid #141414;background:var(--peach);display:grid;place-items:center;box-shadow:var(--st);transition:transform .2s var(--spring);flex:none}
.rec svg{width:32px;height:32px;fill:none;stroke:#141414;stroke-width:2.4;stroke-linecap:round}
.rec.on{background:var(--yel);animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(253,224,71,.8),var(--st)}100%{box-shadow:0 0 0 18px rgba(253,224,71,0),var(--st)}}
.w{display:inline-block;padding:2px 6px;border-radius:8px;margin:2px 1px;font-weight:700}
.w.g{background:var(--goodbg);color:var(--good)}.w.m{background:var(--butter);color:#5A4A00}.w.b{background:var(--badbg);color:var(--bad);text-decoration:underline wavy}
.tr{display:grid;gap:4px}
.tr button{text-align:left;padding:8px 12px;border-radius:12px;display:flex;gap:12px;font-weight:500}
.tr button:hover{background:var(--soft)}
.tr button.on{background:var(--yel);color:#141414;font-weight:700}
.tr time{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--muted);padding-top:3px}
.tr button.on time{color:#141414}
.video{aspect-ratio:16/9;border-radius:20px;border:2.5px solid #141414;background:#141414;position:relative;overflow:hidden;display:grid;place-items:center;color:#fff}
.video .play{width:72px;height:72px;border-radius:50%;background:var(--yel);border:3px solid #fff;display:grid;place-items:center;transition:transform .25s var(--spring)}
.video .play:hover{transform:scale(1.1)}
.video .play svg{width:28px;height:28px;fill:#141414}
.video .cap{position:absolute;left:50%;bottom:54px;transform:translateX(-50%);background:rgba(0,0,0,.75);padding:6px 14px;border-radius:10px;font-weight:600;max-width:90%;text-align:center}
.video .vb{position:absolute;left:14px;right:14px;bottom:14px;display:flex;gap:10px;align-items:center;font-size:12px;font-weight:700}
.video .vb .bar{flex:1;background:#333;border-color:#333}.video .vb .bar i{background:var(--yel)}
textarea.wr{width:100%;min-height:180px;border:2.5px solid var(--ink);border-radius:18px;padding:16px;font-size:17px;line-height:1.7;resize:vertical;background:var(--paper)}
.mark{background:var(--butter);color:#141414;border-bottom:3px solid #D4A900;border-radius:4px;padding:0 2px;cursor:pointer}
.mark.fixed{background:var(--goodbg);color:var(--good);border-color:var(--good)}

/* plan / pricing */
.plan{border:2px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:6px;text-align:left;transition:transform .25s var(--spring),border-color .2s,box-shadow .25s;background:var(--paper)}
.plan:hover{border-color:var(--ink)}
.plan[aria-pressed="true"]{border:2.5px solid #141414;background:var(--butter);color:#141414;box-shadow:var(--st-sm)}
.plan[aria-pressed="true"] .muted{color:#4A4A3A}
.plan .pr{font-family:var(--f-d);font-weight:800;font-size:22px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:8px 10px;border-bottom:2px solid var(--line)}
.tbl td{padding:12px 10px;border-bottom:1.5px solid var(--line)}
.tbl td.r,.tbl th.r{text-align:right}
.sumrow{display:flex;justify-content:space-between;padding:6px 0;font-size:14.5px}
.sumrow.t{border-top:2px dashed var(--line);margin-top:6px;padding-top:12px;font-weight:800;font-size:17px}

.sw{flex:none;width:46px;height:28px;border-radius:999px;border:2.5px solid var(--ink);position:relative;background:var(--paper);transition:background .2s}

.set{display:flex;gap:14px;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1.5px solid var(--line)}
.set b{display:block}.set small{color:var(--muted);font-size:13px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{border:2px solid var(--ink);border-radius:999px;padding:6px 13px;font-weight:700;font-size:13.5px}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.slots{display:grid;grid-template-columns:auto repeat(7,1fr);gap:4px;font-size:12px;font-weight:700}
.slots span{display:grid;place-items:center;color:var(--muted)}
.slots button{height:28px;border-radius:7px;border:1.5px solid var(--line)}
.slots button[aria-pressed="true"]{background:var(--mint);border-color:#141414}

/* sheets / modal */
.scrim{position:fixed;inset:0;background:rgba(20,20,20,.45);z-index:80;display:none;align-items:center;justify-content:center;padding:16px}
.scrim.show{display:flex;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.modal{background:var(--paper);border:3px solid #141414;border-radius:26px;box-shadow:6px 6px 0 #141414;max-width:560px;width:100%;padding:26px;display:grid;gap:16px;max-height:88vh;overflow:auto;animation:pop .4s var(--spring)}
@keyframes pop{from{transform:scale(.9) translateY(14px);opacity:0}}
.side{position:fixed;top:34px;right:0;bottom:0;width:min(420px,100%);background:var(--paper);border-left:3px solid #141414;z-index:85;transform:translateX(105%);transition:transform .4s var(--spring);display:grid;grid-template-rows:auto 1fr;box-shadow:-6px 0 0 #141414}
.side.show{transform:none}
.side header{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:2px solid var(--line)}
.side .sb{overflow:auto;padding:16px 18px 40px;display:grid;gap:12px;align-content:start}
.note{border-left:4px solid var(--yel);background:var(--soft);border-radius:0 12px 12px 0;padding:10px 12px;font-size:14px}
.note b{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.note.fix{border-left-color:var(--bad)}.note.new{border-left-color:var(--good)}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.map a{border:2px solid var(--line);border-radius:14px;padding:10px 12px;display:grid;gap:2px;font-size:13px}
.map a:hover{border-color:var(--ink);background:var(--butter);color:#141414}
.map a b{font-size:14px}.map code{font-size:11px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,30px);opacity:0;background:#141414;color:#fff;font-weight:700;padding:11px 18px;border-radius:14px;z-index:95;transition:all .35s var(--spring);box-shadow:4px 4px 0 var(--yel);max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:90}
.emo{display:flex;gap:10px;flex-wrap:wrap}
.emo button{border:2.5px solid var(--ink);border-radius:18px;padding:12px 14px;display:grid;justify-items:center;gap:4px;font-weight:700;font-size:13px;min-width:96px;transition:transform .2s var(--spring)}
.emo button:hover{transform:translateY(-3px)}
.emo button[aria-pressed="true"]{background:var(--yel);color:#141414;box-shadow:var(--st-sm)}
.emo .zz{width:46px}
.heat{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.heat i{aspect-ratio:1;border-radius:6px}
.empty{border:2px dashed var(--line);border-radius:18px;padding:22px;text-align:center;color:var(--muted)}
.page-reader{display:grid;grid-template-columns:220px minmax(0,1fr) 260px;gap:18px}
@media (max-width:1020px){.page-reader{grid-template-columns:1fr}}
.paper{border:2px solid var(--line);border-radius:18px;padding:clamp(18px,3vw,40px);font-size:17px;line-height:1.8;position:relative}
.paper .wm{position:absolute;right:16px;bottom:12px;font-size:11px;color:var(--muted)}
.paper .hlw{background:var(--yel);color:#141414;border-radius:4px;padding:0 3px;cursor:pointer}

/* phone */
.tabbar{display:none}
@media (max-width:760px){
  .app{grid-template-columns:1fr}.rail{display:none}.main{grid-column:1}
  .top{padding:10px 14px}.top .hide-m{display:none}
  .page{padding:18px 16px 110px}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--paper);border-top:2.5px solid var(--ink);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
  .tabbar a{display:grid;justify-items:center;gap:1px;font-size:11px;font-weight:800;padding:6px 0;border-radius:12px;transition:transform .25s var(--spring)}
  .tabbar a.on{background:var(--yel);color:#141414}.tabbar a.on .ic svg{stroke:#141414}
  .tabbar .ic svg{width:22px;height:22px}
  .clock{right:12px;bottom:80px}
  .msg{max-width:92%}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition-duration:.01ms!important}}

/* ---------- small builders ---------- */
const PH=(ey,h,p='',right='')=>`<header class="ph"><div><span class="ey">${ey}</span><h1>${h}</h1>${p?`<p>${p}</p>`:''}</div>${right}</header>`;
const ring=(v,max,top,sub)=>{const C=264,off=C*(1-Math.min(1,v/max));return `<div class="ring"><svg viewBox="0 0 100 100"><circle class="bgc" cx="50" cy="50" r="42"/><circle class="fg" cx="50" cy="50" r="42" stroke-dasharray="${C}" stroke-dashoffset="${C}" data-off="${off}"/></svg><b>${top}<small>${sub}</small></b></div>`;};
const dat=()=>D.blocks.filter(b=>b[1]==='dat').length;
const luyen=()=>D.blocks.findIndex(b=>b[1]==='luyen')+1;
const giup=()=>D.blocks.findIndex(b=>b[1]==='giup')+1;
const segBar=()=>`<div style="display:grid;grid-template-columns:repeat(12,1fr);gap:4px">${D.blocks.map(b=>`<i style="height:10px;border-radius:5px;border:1.5px solid ${b[1]==='khoa'?'var(--line)':'#141414'};background:${{dat:'var(--mint)',luyen:'var(--yel)',giup:'var(--peach)',khoa:'var(--soft)'}[b[1]]}"></i>`).join('')}</div>`;
const zsay=(t,st='normal',hood)=>`<div class="zs">${Z(st,hood||L().hood)}<div class="bub">${t}</div></div>`;
const back=(h,t)=>`<a class="lk" href="${h}" style="justify-self:start;border:0;display:inline-flex;gap:6px;align-items:center">${svg('back')}<span style="border-bottom:3px solid var(--yel)">${t}</span></a>`;

 <div class="g g2">

function taskRow(t){const done=ST.done.has(t.id);
 return `<div class="li ${done?'done':''}" draggable="${!done}" data-id="${t.id}">
  <span class="grip" aria-hidden="true">⋮⋮</span>
  <button class="sq" style="background:${done?'var(--mint)':t.bg}" data-done="${t.id}" aria-label="${done?'Đã xong':'Đánh dấu xong'}">${svg(done?'check':t.ic)}</button>
  <span class="bd"><b>${t.t}</b><small>${t.s} · ${t.min} phút</small></span>
  ${t.tag[0]?`<span class="tag ${t.tag[1]}">${t.tag[0]}</span>`:''}
  ${done?'':`<a class="btn sm" href="${t.go}">Bắt đầu</a><button class="btn sm o hide-m" data-later="${t.id}" title="Dời sang ngày mai">Hoãn</button>`}
 </div>`;}
V['hom-nay'].after=()=>{
 const box=$('#tlist');
 box.onclick=e=>{const d=e.target.closest('[data-done]'),l=e.target.closest('[data-later]');
  if(d){ST.done.has(d.dataset.done)?ST.done.delete(d.dataset.done):ST.done.add(d.dataset.done);render();if(ST.done.size===D.tasks.length)confetti();}
  if(l){const row=l.closest('.li');row.style.transition='all .4s';row.style.opacity='0';row.style.transform='translateX(40px)';setTimeout(()=>row.remove(),400);toast('Đã dời sang ngày mai. Zen sẽ nhắc lại sáng mai.');}};
 let drag;box.addEventListener('dragstart',e=>{drag=e.target.closest('.li');drag.style.opacity='.4';});
 box.addEventListener('dragend',()=>{if(drag)drag.style.opacity='';});
 box.addEventListener('dragover',e=>{e.preventDefault();const o=e.target.closest('.li');if(!o||o===drag)return;const r=o.getBoundingClientRect();box.insertBefore(drag,e.clientY<r.top+r.height/2?o:o.nextSibling);});

/* ===== HV-02 Check-in ===== */
const CK={step:0,emo:null,ans:{}};
const WARM=[['Yesterday I ___ to the cinema.',['go','went','gone'],1,'Quá khứ đơn'],['Next Saturday we ___ visit my grandma.',['are going to','going to','will to'],0,'Be going to'],['She ___ like coffee.',["don't","doesn't","isn't"],1,'Hiện tại đơn'],['Look at the clouds! It ___ rain.',['is going to','goes to','is go'],0,'Be going to']];
V['check-in']=()=>{const s=CK.step;
 const steps=`<div class="steps">${[0,1,2,3].map(i=>`<i class="${i<s?'done':i===s?'on':''}"></i>`).join('')}</div>`;
 let body='';
 if(s===0)body=`${zsay('Chào bạn! Trước khi vào lớp, mình hỏi nhanh: hôm nay bạn thấy thế nào?','happy')}
  <div class="emo">${[['happy','Sẵn sàng'],['normal','Bình thường'],['think','Hơi mệt'],['sad','Chưa hiểu bài trước']].map(([e,t])=>`<button data-emo="${e}" aria-pressed="${CK.emo===e}">${Z(e,L().hood)}${t}</button>`).join('')}</div>
  <div class="row"><button class="btn" data-next ${CK.emo?'':'disabled'}>Tiếp ${svg('arrow')}</button></div>`;
 if(s===1)body=`${zsay(CK.emo==='sad'?'Không sao, mình giảng lại kỹ hơn một chút nhé.':'Mình giảng lại bài trước trong 90 giây nha.','normal')}
  <div class="c k"><span class="ey">Khối 4 · Kể chuyện đã qua</span><h2>Quá khứ đơn: việc đã xong, có thời gian rõ</h2>
   <p>Dấu hiệu: <b>yesterday, last week, 2 years ago</b>. Động từ có quy tắc thêm <b>-ed</b>, bất quy tắc phải nhớ.</p>
   <div class="g g3" style="gap:10px">${[['go','went'],['see','saw'],['eat','ate']].map(([a,b])=>`<div class="c bg-soft" style="padding:12px;text-align:center"><b style="font-size:20px">${a} → <span style="background:var(--yel);color:#141414;padding:0 6px;border-radius:6px">${b}</span></b></div>`).join('')}</div>
   <p class="muted">Tuần trước bạn hay viết <s>"I go to school yesterday"</s>. Đúng là: <b>I went to school yesterday.</b></p></div>
  <div class="row"><button class="btn" data-next>Mình hiểu rồi ${svg('arrow')}</button><button class="btn o" onclick="toast('Zen giảng lại bằng ví dụ khác: kể lại hôm qua bạn ăn gì.')">Giảng cách khác</button></div>`;
 if(s===2)body=`${zsay('Tối nay cô Lan dạy phần này. Biết trước thì vào lớp nói được nhiều hơn.','wow')}
  <div class="c k bg-sky fill"><span class="ey">${D.cls.when} · ${D.cls.teacher}</span><h2>${D.cls.goal}</h2>
   <div class="g" style="gap:8px">${['Khởi động 5 phút: kể lại cuối tuần trước (quá khứ đơn)','Học mẫu câu: I\'m going to + động từ','Nói theo cặp: lên kế hoạch cuối tuần cho cả nhóm','10 phút cuối: cô Lan kèm riêng Khối 4 cho bạn nào cần'].map((t,i)=>`<div class="li" style="background:#fff;color:#141414;border-color:#141414"><span class="sq" style="background:var(--butter)">${i+1}</span><span class="bd"><b>${t}</b></span></div>`).join('')}</div></div>
  <div class="row"><button class="btn" data-next>Khởi động 4 câu ${svg('arrow')}</button></div>`;
 if(s===3){const done=Object.keys(CK.ans).length===WARM.length;
  body=`${zsay('4 câu khởi động. Không tính điểm, chỉ để cô biết bạn đang chắc phần nào.','think')}
  <div class="g" style="gap:12px">${WARM.map((q,i)=>`<div class="c"><b>${i+1}. ${q[0].replace('___','<span class="blank '+(CK.ans[i]!=null?'fillx':'')+'">'+(CK.ans[i]!=null?q[1][CK.ans[i]]:'&nbsp;')+'</span>')}</b>
   <div class="opts">${q[1].map((o,j)=>`<button class="opt ${CK.ans[i]===j?(j===q[2]?'right':'wrong'):''}" data-q="${i}" data-o="${j}" style="font-size:15px;padding:8px 14px" ${CK.ans[i]!=null?'disabled':''}>${o}</button>`).join('')}</div></div>`).join('')}</div>
  <div class="row"><button class="btn" data-finish ${done?'':'disabled'}>Gửi cho cô Lan ${svg('arrow')}</button></div>`;}
 if(s===4){const right=WARM.filter((q,i)=>CK.ans[i]===q[2]).length,weak=WARM.filter((q,i)=>CK.ans[i]!==q[2]).map(q=>q[3]);
  body=`<div class="g g2"><div class="c k bg-mint fill" style="text-align:center;justify-items:center">${Z('happy',L().hood,'cape').replace('class="zz"','class="zz" style="width:120px"')}<h2 style="font-size:28px">Check-in xong! Sẵn sàng ${Math.round(50+right*12.5)}%</h2><p>Khởi động đúng ${right}/4. Đây là mốc "trước" của buổi tối nay. Cuối buổi bạn làm Check-out để thấy mình tiến bộ bao nhiêu.</p></div>
   <div class="c"><h3>Đã gửi cho cô Lan</h3><div class="li"><span class="sq bg-sky">${svg('user')}</span><span class="bd"><b>Cảm xúc: ${{happy:'Sẵn sàng',normal:'Bình thường',think:'Hơi mệt',sad:'Chưa hiểu bài trước'}[CK.emo]}</b><small>Cô biết để hỏi han đầu giờ</small></span></div>
    <div class="li"><span class="sq bg-peach">${svg('flag')}</span><span class="bd"><b>Điểm cần giúp</b><small>${weak.length?weak.join(' · '):'Không có, bạn chắc cả 4 phần'}</small></span></div>
    <p class="muted" style="font-size:13.5px">Cô Lan nhìn bảng nhiệt cả lớp trước giờ học để dạy đúng chỗ yếu.</p>
    <div class="row"><a class="btn" href="#vao-lop">Xem buổi học</a><a class="btn o" href="#hom-nay">Về Hôm nay</a></div></div></div>`;}
 return `${PH('Trước buổi tối nay · khoảng 6 phút','Check-in với Zen',s<4?['Bước 1/4 · Cảm xúc','Bước 2/4 · Giảng lại bài trước','Bước 3/4 · Tối nay học gì','Bước 4/4 · Khởi động'][s]:'')}${s<4?steps:''}<div class="g" style="max-width:860px">${body}</div>`;};
V['check-in'].after=()=>{const p=$('.page');
 p.onclick=e=>{const em=e.target.closest('[data-emo]'),nx=e.target.closest('[data-next]'),o=e.target.closest('[data-q]'),fin=e.target.closest('[data-finish]');

  if(nx){CK.step++;render();}
  if(o&&!o.disabled){CK.ans[+o.dataset.q]=+o.dataset.o;render(false);}
  if(fin){CK.step=4;ST.checkin=true;ST.done.add('t1');render();confetti();}};};

   <div class="peek" aria-hidden="true"><div class="zz" id="peekz"></div></div>
   <div class="rfoot"><a href="#thong-bao" class="it" data-r="thong-bao" data-tip="Thông báo"><i class="ic">${svg('bell')}<span class="dot"></span></i><span class="lbl">Thông báo</span><em class="badge">3</em></a><a href="#ho-so" class="it" data-r="ho-so" data-tip="Hồ sơ"><i class="ic">${svg('gear')}</i><span class="lbl">Hồ sơ và cài đặt</span></a><button class="it" id="nightb" data-tip="Học buổi tối"><i class="ic">${svg('moon')}</i><span class="lbl">Học buổi tối</span></button></div>
  </aside>
  <main class="main"><div class="top"><span class="crumb"><span class="hide-m">Zenford ›</span><b id="crumb"></b></span><span class="sp"></span>
   <span class="chip hide-m" title="Đồng hồ học: phút học tuần này so với kế hoạch">${svg('clock')}<span id="wk"></span></span>
   <button class="chip" id="langchip"></button>
   <a class="ibtn" href="#thong-bao" aria-label="Thông báo">${svg('bell')}<span class="n">3</span></a></div>
   <div class="page" id="page"></div></main>
  <nav class="tabbar" aria-label="Menu điện thoại">${[['hom-nay','home','Hôm nay'],['lich','cal','Lịch'],['lab','flask','Lab'],['hoi-zen','chat','Hỏi Zen'],['more','grid','Thêm']].map(t=>`<a href="#${t[0]}" data-r="${t[0]}"><i class="ic">${svg(t[1])}</i><span>${t[2]}</span></a>`).join('')}</nav>
 </div>
 <div class="scrim" id="scrim"><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
 <aside class="side" id="side" aria-label="Ghi chú cho CIT"><header><div><span class="ey" id="sidescr"></span><h3>Ghi chú cho đội CIT</h3></div><button class="ibtn" id="sidex" aria-label="Đóng">${svg('x')}</button></header><div class="sb" id="sideb"></div></aside>
 <div class="tip" id="tip"></div><div class="toast" id="toast" role="status"></div>`);
 $('#logo').innerHTML=ZenfordNP.logoSVG('#FDE047',34);
 $('#pin').onclick=()=>{const on=$('#rail').classList.toggle('pinned');$('#pin').setAttribute('aria-pressed',on);};
 $('#nightb').onclick=night;
 $('#who').onclick=$('#langchip').onclick=pickLang;
 $('#mapb').onclick=showMap;
 $('#noteb').onclick=()=>{$('#side').classList.toggle('show');fillNotes();};
 $('#sidex').onclick=()=>$('#side').classList.remove('show');
 $('#scrim').onclick=e=>{if(e.target.id==='scrim'||e.target.closest('[data-close]'))closeModal();};
 addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();$('#side').classList.remove('show');}});
 const tip=$('#tip'),rail=$('#rail');
 $$('.rail .it').forEach(a=>{a.addEventListener('mouseenter',()=>{if(rail.offsetWidth>120)return;const r=a.getBoundingClientRect();tip.textContent=a.dataset.tip;tip.style.left=(r.right+14)+'px';tip.style.top=(r.top+r.height/2-15)+'px';tip.classList.add('show');});a.addEventListener('mouseleave',()=>tip.classList.remove('show'));});
 rail.addEventListener('transitionend',()=>{if(rail.offsetWidth>120)tip.classList.remove('show');});
 $('.tabbar [data-r="more"]').onclick=e=>{e.preventDefault();showMap();};
}
function isDark(){return getComputedStyle(document.documentElement).colorScheme==='dark';}
function night(){document.documentElement.setAttribute('data-theme',isDark()?'light':'dark');}
function pickLang(){modal(`<div class="ch"><h2>Ngôn ngữ đang học</h2><button class="ibtn" data-close aria-label="Đóng">${svg('x')}</button></div>
 ${Object.entries(D.langs).map(([k,l])=>`<button class="li" data-lang="${k}" style="${D.lang===k?'border-color:var(--ink);background:var(--butter);color:#141414':''}"><span class="sq" style="background:${l.col}">${l.code}</span><span class="bd" style="text-align:left"><b>${l.name} · ${l.now} → ${l.goal}</b><small>${l.plan}</small></span>${D.lang===k?'<span class="tag ink">Đang chọn</span>':''}</button>`).join('')}
 <a class="btn o" href="#goi" data-close>+ Học thêm ngôn ngữ</a><p class="muted" style="font-size:13px">Mỗi ngôn ngữ có lộ trình, Lab, Vở AI và gói phí riêng. Bản mẫu chỉ có dữ liệu Tiếng Anh.</p>`);
 $('#modal').onclick=e=>{const b=e.target.closest('[data-lang]');if(b){D.lang=b.dataset.lang;closeModal();render(false);toast('Đang học '+L().name);}};}
function modal(h){$('#modal').innerHTML=h;$('#scrim').classList.add('show');ZenfordNP.blink();}
function closeModal(){$('#scrim').classList.remove('show');}
function showMap(){modal(`<div class="ch"><h2>Tất cả màn · ${SCR.length}</h2><button class="ibtn" data-close aria-label="Đóng">${svg('x')}</button></div><p class="muted" style="font-size:14px">16 màn CIT gửi được gộp và làm lại. Thêm các màn còn thiếu (ghi "Mới").</p><div class="map">${SCR.map(s=>`<a href="#${s[0]}" data-close><code>${s[1]}</code><b>${s[2]}</b><small class="muted">${s[4]}</small></a>`).join('')}</div>`);$('#modal').style.maxWidth='900px';}
function fillNotes(){const k=cur(),s=SC[k];$('#sidescr').textContent=s[1]+' · '+s[2];
 const n=NOTES[k]||[],lab={fix:'Sửa so với bản CIT',new:'Thêm mới',rule:'Quy tắc'};
 $('#sideb').innerHTML=n.map(([t,x])=>`<div class="note ${t}"><b>${lab[t]}</b>${x}</div>`).join('')+`<details style="margin-top:8px"><summary style="font-weight:800;cursor:pointer">Quy tắc chung cho mọi màn (${COMMON.length})</summary><div class="g" style="gap:8px;margin-top:10px">${COMMON.map(([t,x])=>`<div class="note">${x}</div>`).join('')}</div></details>`;}
function confetti(){if(REDUCE)return;const c=document.createElement('div');c.className='confetti';const cols=['#FDE047','#BDEFD8','#D8CCFF','#FFD2B8','#BFE4FF'];
 for(let i=0;i<46;i++){const s=document.createElement('i');const x=Math.random()*100,d=1.4+Math.random()*1.4;s.style.cssText=`position:absolute;left:${x}%;top:-20px;width:${8+Math.random()*8}px;height:${10+Math.random()*10}px;background:${cols[i%5]};border:2px solid #141414;border-radius:${Math.random()<.5?'50%':'3px'};transform:rotate(${Math.random()*360}deg);transition:top ${d}s cubic-bezier(.2,.6,.4,1),transform ${d}s`;c.append(s);}
 document.body.append(c);requestAnimationFrame(()=>requestAnimationFrame(()=>[...c.children].forEach(s=>{s.style.top='110%';s.style.transform=`rotate(${Math.random()*720}deg)`;})));setTimeout(()=>c.remove(),3000);}

function render(anim=true){const k=cur(),p=$('#page');
 p.innerHTML=V[k]();
 if(anim){p.style.animation='none';void p.offsetWidth;p.style.animation='';}
 ZenfordNP.mount(p);
 requestAnimationFrame(()=>$$('.ring .fg',p).forEach(c=>c.style.strokeDashoffset=c.dataset.off));
 if(V[k].after)V[k].after();
 const own=OWN[k]||k;
 $$('[data-r]').forEach(a=>{a.classList.toggle('on',a.dataset.r===own);a.toggleAttribute('aria-current',a.dataset.r===own);});
 $('#crumb').textContent=SC[k][2];$('#scr').textContent=SC[k][1];document.title=SC[k][2]+' · Zenford';
 const left=D.tasks.filter(t=>!ST.done.has(t.id)).length;$('#todo').textContent=left;
 $('#wk').textContent=`${D.week.done}/${D.week.plan} phút tuần này`;
 $('#langchip').innerHTML=`<b style="background:${L().col};color:#141414;border-radius:6px;padding:0 5px">${L().code}</b> ${L().name} <span class="hide-m">· ${L().now}→${L().goal}</span>`;
 $('#flag').textContent=L().code;$('#wholang').textContent=`${L().name} · đang luyện Khối ${luyen()}`;
 if($('#side').classList.contains('show'))fillNotes();}
function route(){ST.timers.forEach(clearInterval);ST.timers=[];ST.extra.forEach(e=>e.remove());ST.extra=[];
 if(location.hash==='#more'){showMap();return;}
 closeModal();render(true);scrollTo({top:0,behavior:REDUCE?'auto':'instant'});}

shell();
$('#peekz').innerHTML=ZenfordNP.zenSVG('happy','#FDE047','');$('#peekz').classList.add('zfollow');
addEventListener('hashchange',route);route();
ZenfordNP.followEyes();ZenfordNP.blink();
</script>
