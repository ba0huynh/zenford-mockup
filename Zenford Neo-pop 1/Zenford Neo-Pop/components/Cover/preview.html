<!-- @dsCard height=288 -->
<div style="position:relative;width:960px;height:288px;background:var(--paper);overflow:hidden;font-family:var(--font-body)">
<style>
.c-y{fill:var(--yellow)}.c-s{fill:var(--sky)}.c-m{fill:var(--mint)}.c-l{fill:var(--lavender)}.c-p{fill:var(--peach)}.c-k{fill:var(--ink)}.c-w{fill:var(--paper)}
.c-o{stroke:var(--ink);stroke-width:2.5}
</style>
<svg width="960" height="288" viewBox="0 0 960 288" style="position:absolute;inset:0" aria-hidden="true">
<!-- blocks: yellow 240x232 (identity slab), sky 160x120, mint 120x96, lavender 96x64, peach 64x64, ink offsets = shadow-sticker-lg 5px -->
<!-- arrangement: staggered sticker stack bleeding off the top-right, each block outlined in ink with its solid 5px ink offset -->
<!-- pattern: checker (race flag / grid notebook) at 16px pitch in ink on paper, a strip of 3x16 units — chosen because the README names the race theme and the zf-checker motif -->
<!-- scales: radius-lg 20 on slabs, radius-xl 26 on the tall slab, radius-full on the peach pill; offsets 5px; gaps space-5 20 -->
<rect x="705" y="-30" width="240" height="232" rx="26" class="c-k"/><rect x="700" y="-35" width="240" height="232" rx="26" class="c-y c-o"/>
<rect x="545" y="125" width="160" height="120" rx="20" class="c-k"/><rect x="540" y="120" width="160" height="120" rx="20" class="c-s c-o"/>
<rect x="745" y="215" width="120" height="96" rx="20" class="c-k"/><rect x="740" y="210" width="120" height="96" rx="20" class="c-m c-o"/>
<rect x="595" y="35" width="96" height="64" rx="20" class="c-k"/><rect x="590" y="30" width="96" height="64" rx="20" class="c-l c-o"/>
<rect x="885" y="225" width="64" height="40" rx="20" class="c-k"/><rect x="880" y="220" width="64" height="40" rx="20" class="c-p c-o"/>
<g transform="translate(500 256)">
<rect width="192" height="32" class="c-w c-o"/>
<g class="c-k"><rect x="0" y="0" width="16" height="16"/><rect x="32" y="0" width="16" height="16"/><rect x="64" y="0" width="16" height="16"/><rect x="96" y="0" width="16" height="16"/><rect x="128" y="0" width="16" height="16"/><rect x="160" y="0" width="16" height="16"/>
<rect x="16" y="16" width="16" height="16"/><rect x="48" y="16" width="16" height="16"/><rect x="80" y="16" width="16" height="16"/><rect x="112" y="16" width="16" height="16"/><rect x="144" y="16" width="16" height="16"/><rect x="176" y="16" width="16" height="16"/></g>
</g>
</svg>
<div style="position:absolute;left:40px;bottom:36px;max-width:440px;display:grid;gap:12px">
<div style="font-family:var(--font-display);font-weight:800;font-size:100px;line-height:.95;letter-spacing:-.03em;color:var(--ink)">Zenford<br>Neo-Pop</div>
<div style="font-size:14px;color:var(--muted);font-weight:600">Học chơi mà giỏi thiệt ?! Nền trắng, pastel đều màu, vàng nóng, viền đen như hình dán.</div>
</div>
</div>
